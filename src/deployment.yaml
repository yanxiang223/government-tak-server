# ============================================================================
# TAK Server Kubernetes Deployment
# ============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: tak
  labels:
    app: tak-server
---
apiVersion: v1
kind: Secret
metadata:
  name: tak-secrets
  namespace: tak
type: Opaque
stringData:
  # 请通过环境变量或 Kubernetes Secret 注入实际值
  DB_HOST: "changeme"
  DB_PORT: "5432"
  DB_NAME: "takdb"
  DB_USER: "takuser"
  DB_PASSWORD: "changeme"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tak-config
  namespace: tak
data:
  TAK_VERSION: "5.4.0"
  TAK_HTTP_PORT: "8089"
  TAK_HTTPS_PORT: "8443"
  SFS_MOUNT_PATH: "/tak/data"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tak-data
  namespace: tak
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: sfs
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tak-server
  namespace: tak
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tak-server
  template:
    metadata:
      labels:
        app: tak-server
        version: "5.4.0"
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - tak-server
                topologyKey: kubernetes.io/hostname
      containers:
        - name: tak-server
          image: tak-server:5.4.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8089
              protocol: TCP
            - name: https
              containerPort: 8443
              protocol: TCP
          envFrom:
            - configMapRef:
                name: tak-config
            - secretRef:
                name: tak-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          volumeMounts:
            - name: tak-data
              mountPath: /tak/data
          livenessProbe:
            httpGet:
              path: /status
              port: 8089
            initialDelaySeconds: 60
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /status
              port: 8089
            initialDelaySeconds: 30
            periodSeconds: 5
      volumes:
        - name: tak-data
          persistentVolumeClaim:
            claimName: tak-data
---
apiVersion: v1
kind: Service
metadata:
  name: tak-server
  namespace: tak
  labels:
    app: tak-server
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8089
      targetPort: 8089
      protocol: TCP
    - name: https
      port: 8443
      targetPort: 8443
      protocol: TCP
  selector:
    app: tak-server
---
apiVersion: v1
kind: Service
metadata:
  name: tak-server-lb
  namespace: tak
  labels:
    app: tak-server
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  ports:
    - name: http
      port: 8089
      targetPort: 8089
      protocol: TCP
    - name: https
      port: 8443
      targetPort: 8443
      protocol: TCP
  selector:
    app: tak-server
